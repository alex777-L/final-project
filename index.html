<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="landing">
      <div class="nav__container">
        <div class="row">
          <nav>
            <a class="logo__link" href="#">
              <img
                class="logo__img"
                src="/assets/logo.2c489fc453a1783cbadacf914efa3df6.svg"
                alt=""
              /><b>Treact</b>
            </a>
            <ul class="nav__links">
              <li class="nav__link">About</li>
              <li class="nav__link">Blog</li>
              <li class="nav__link">Pricing</li>
              <li class="nav__link">Contact us</li>
              <li class="nav__link nav__link--login">Login</li>
              <li class="nav__link nav__link--signup">Sign Up</li>
            </ul>
          </nav>
        </div>
      </div>
    </section>
    <section>
      <div class="row">
        <div class="highlights">
          <div class="highlights__description">
            <h1>
              Beautiful React Templates <span class="purple"> for you.</span>
            </h1>
            <p>
              Our templates are easy to setup, understand and customize. Fully
              modular components wiith a variety of pages and components.
            </p>
            <div class="get__started">
              <input type="email" placeholder="Your E-mail Address" />
              <button class="btn">Get Started</button>
            </div>
            <figure class="trusted__customers">
              <h2>OUR TRUSTED CUSTOMERS</h2>
              <img
                class="trusted__customers--img"
                src="/assets/customers-logo-strip.680ac7c2e8ae28161d2c.png"
                alt=""
              />
            </figure>
          </div>
          <div class="design__illustration">
            <img
              class="design__illustration--img"
              src="/assets/design-illustration-2.6da6a00b20c07c4a9b65d1870679e1b8.svg"
              alt=""
            />
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
